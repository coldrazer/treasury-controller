# /etc/nginx/snippets/treasury-proxy.conf — shared proxy settings for the dashboard.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;               # webui.py checks it against TREASURY_PUBLIC_ORIGIN
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_buffering on;                        # nginx absorbs slow clients; the app is single-threaded
proxy_request_buffering on;
# The app already sends these on every response; hide its copies so the server block's
# add_header (which also covers nginx's own 404/429 pages) is the single source.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
