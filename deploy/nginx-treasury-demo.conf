# nginx site for the public dashboard demo.
# Install: sudo cp deploy/nginx-treasury-demo.conf /etc/nginx/sites-available/treasury-demo
#          sudo ln -sf /etc/nginx/sites-available/treasury-demo /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Replace demo.example.com with your host (e.g. 98-81-148-190.sslip.io) and keep the certbot paths in step.

# Rate limits (per client IP). Sign-in and card signing are the only endpoints worth guessing at.
limit_req_zone  $binary_remote_addr zone=tc_auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=tc_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=tc_page:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tc_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.example.com;

    ssl_certificate     /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;                     # no nginx version in the Server header
    client_max_body_size 64k;              # the app refuses anything larger anyway
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_conn tc_conn 20;
    limit_req_status 429;

    # Belt and braces: the app sends these too.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Only the routes the dashboard serves; everything else never reaches Python.
    location = / {
        limit_req zone=tc_page burst=10 nodelay;
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/treasury-proxy.conf;
    }
    location ^~ /static/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/treasury-proxy.conf;
    }
    location = /api/login {
        limit_req zone=tc_auth burst=5 nodelay;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/treasury-proxy.conf;
    }
    location = /api/sign {
        limit_req zone=tc_auth burst=5 nodelay;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/treasury-proxy.conf;
    }
    location ^~ /api/ {
        limit_req zone=tc_api burst=20 nodelay;
        include /etc/nginx/snippets/treasury-proxy.conf;
    }
    location / { return 404; }
}
